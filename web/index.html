<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by `flutter build web --base-href`.
    Leave it as "/" when hosting at the root of a domain (Firebase Hosting).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Trading leagues for dreamDEX perps. Start a league, share a code, and compete with friends on real testnet P&L.">
  <meta name="theme-color" content="#0A0E13">

  <!-- Link previews in WhatsApp, X and Telegram -->
  <meta property="og:title" content="Perps League">
  <meta property="og:description" content="You've been challenged. Join a dreamDEX perps league and climb the leaderboard.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS: installable to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Perps League">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Perps League</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0A0E13; }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0A0E13; transition: opacity 0.3s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    // Fade the splash once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
